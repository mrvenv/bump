name: Publish

on:
  workflow_dispatch:
    inputs:
      semver_part:
        description: Part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      tag:
        description: Also create a git tag and GitHub release
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

# Never run two releases at once: they would race on the version commit.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    # Skip the release commit itself (matters if pushes are ever made with a PAT instead of GITHUB_TOKEN).
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release')"
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PART: ${{ inputs.semver_part || 'patch' }}
      # On push there are no inputs: use the input's default (true).
      TAG: ${{ github.event_name == 'push' || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (local commit, and tag if requested)
        id: bump
        run: |
          if [ "$TAG" = "true" ]; then
            bun src/cli/bin.ts "$PART" -m "chore: release v%s"
          else
            bun src/cli/bin.ts "$PART" --no-git-tag-version
            git commit -am "chore: release v$(bun src/cli/bin.ts)"
          fi
          echo "version=v$(bun src/cli/bin.ts)" >> "$GITHUB_OUTPUT"

      - run: bun run build

      # Publish before pushing: if npm fails, nothing reaches main.
      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Create GitHub release
        if: env.TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          cp dist/bump dist/bump-linux-x64
          gh release create "$VERSION" --title "$VERSION" --generate-notes dist/bump-linux-x64

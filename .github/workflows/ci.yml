name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by publish.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint and format (Biome)
        run: bunx biome ci --reporter=github .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build standalone binary
        run: bun run build
      - name: Smoke-test binary
        run: ./dist/bump --help
